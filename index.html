let _tidePoints = [];

function drawEmotionTide() {
  const canvas = document.getElementById('tide-canvas');
  if (!canvas) return;
  if (!canvas._bound) {
    canvas.addEventListener('click', handleTideClick);
    canvas._bound = true;
  }
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const padL = 42, padR = 16, padT = 16, padB = 28;
  const mapW = W - padL - padR, mapH = H - padT - padB;

  ctx.clearRect(0, 0, W, H);

  // 收集所有事件并按时间排序
  const allEvents = [...growthEvents].sort((a, b) => new Date(a.time) - new Date(b.time));
  const countEl = document.getElementById('tide-count');
  if (countEl) countEl.textContent = allEvents.length ? '(' + allEvents.length + '个节点)' : '';

  if (allEvents.length === 0) {
    ctx.fillStyle = '#666';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无情绪数据', W / 2, H / 2);
    return;
  }

  // 讨论装饰星点
  for (let i = 0; i < 20; i++) {
    const sx = padL + Math.random() * mapW;
    const sy = padT + Math.random() * mapH;
    const sr = Math.random() * 1.2 + 0.3;
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.08 + 0.02) + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }

  // 水平网格线
  ctx.strokeStyle = 'rgba(120,140,200,.08)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + (mapH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(W - padR, y);
    ctx.stroke();
  }
  // Y轴标签
  ctx.fillStyle = 'rgba(160,170,200,.5)';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'right';
  ['1.0', '0.75', '0.5', '0.25', '0'].forEach((label, i) => {
    ctx.fillText(label, padL - 4, padT + (mapH / 4) * i + 3);
  });

  // 计算X坐标（按时间均匀分布或按实际时间比例）
  const firstTime = new Date(allEvents[0].time).getTime();
  const lastTime = new Date(allEvents[allEvents.length - 1].time).getTime();
  const timeSpan = Math.max(lastTime - firstTime, 1);

  const points = allEvents.map(ev => {
    const emo = inferEmotion(ev);
    const t = new Date(ev.time).getTime();
    const xRatio = allEvents.length === 1 ? 0.5 : (t - firstTime) / timeSpan;
    const x = padL + xRatio * mapW;
    const lpY = padT + (1 - emo.love_presence) * mapH;
    const enY = padT + (1 - emo.energy) * mapH;
    return { x, lpY, enY, emo, ev };
  });

  // === 绘制爱的在场度曲线（暖色） ===
  if (points.length >= 2) {
    // 填充区域
    const lpGrad = ctx.createLinearGradient(0, padT, 0, padT + mapH);
    lpGrad.addColorStop(0, 'rgba(255,140,66,.18)');
    lpGrad.addColorStop(1, 'rgba(255,183,197,.02)');
    ctx.fillStyle = lpGrad;
    ctx.beginPath();
    ctx.moveTo(points[0].x, padT + mapH);
    ctx.lineTo(points[0].x, points[0].lpY);
    for (let i = 1; i < points.length; i++) {
      const prev = points[i - 1], curr = points[i];
      const cpx = (prev.x + curr.x) / 2;
      ctx.bezierCurveTo(cpx, prev.lpY, cpx, curr.lpY, curr.x, curr.lpY);
    }
    ctx.lineTo(points[points.length - 1].x, padT + mapH);
    ctx.closePath();
    ctx.fill();

    // 曲线线
    const lpLineGrad = ctx.createLinearGradient(padL, 0, W - padR, 0);
    lpLineGrad.addColorStop(0, '#FF8C42');
    lpLineGrad.addColorStop(1, '#FFB7C5');
    ctx.strokeStyle = lpLineGrad;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = 'rgba(255,140,66,.4)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].lpY);
    for (let i = 1; i < points.length; i++) {
      const prev = points[i - 1], curr = points[i];
      const cpx = (prev.x + curr.x) / 2;
      ctx.bezierCurveTo(cpx, prev.lpY, cpx, curr.lpY, curr.x, curr.lpY);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // === 绘制能量曲线（冷色） ===
  if (points.length >= 2) {
    const enGrad = ctx.createLinearGradient(0, padT, 0, padT + mapH);
    enGrad.addColorStop(0, 'rgba(93,173,226,.15)');
    enGrad.addColorStop(1, 'rgba(78,205,196,.02)');
    ctx.fillStyle = enGrad;
    ctx.beginPath();
    ctx.moveTo(points[0].x, padT + mapH);
    ctx.lineTo(points[0].x, points[0].enY);
    for (let i = 1; i < points.length; i++) {
      const prev = points[i - 1], curr = points[i];
      const cpx = (prev.x + curr.x) / 2;
      ctx.bezierCurveTo(cpx, prev.enY, cpx, curr.enY, curr.x, curr.enY);
    }
    ctx.lineTo(points[points.length - 1].x, padT + mapH);
    ctx.closePath();
    ctx.fill();

    const enLineGrad = ctx.createLinearGradient(padL, 0, W - padR, 0);
    enLineGrad.addColorStop(0, '#5DADE2');
    enLineGrad.addColorStop(1, '#4ECDC4');
    ctx.strokeStyle = enLineGrad;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = 'rgba(93,173,226,.4)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].enY);
    for (let i = 1; i < points.length; i++) {
      const prev = points[i - 1], curr = points[i];
      const cpx = (prev.x + curr.x) / 2;
      ctx.bezierCurveTo(cpx, prev.enY, cpx, curr.enY, curr.x, curr.enY);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // === 绘制数据点 ===
  _tidePoints = [];
  points.forEach(p => {
    const color = EMOTION_COLORS[p.emo.primary] || '#87ceeb';
    // 爱的在场度点（上方）
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.lpY, 4, 0, Math.PI * 2);
    ctx.fill();
    // 白色高光
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath();
    ctx.arc(p.x - 1, p.lpY - 1, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // 能量点（下方，用空心圆区分）
    ctx.shadowColor = '#5DADE2';
    ctx.shadowBlur = 6;
    ctx.strokeStyle = '#4ECDC4';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.enY, 3.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    _tidePoints.push({ x: p.x, lpY: p.lpY, enY: p.enY, emo: p.emo, ev: p.ev });
  });

  // X轴时间标签
  ctx.fillStyle = 'rgba(160,170,200,.5)';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'center';
  const firstDate = new Date(firstTime);
  const lastDate = new Date(lastTime);
  const sameDay = firstDate.toDateString() === lastDate.toDateString();
  if (sameDay) {
    ctx.fillText(firstDate.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric' }), padL + 10, H - 8);
    ctx.fillText(firstDate.toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' }), padL + 10, H - 20);
    ctx.fillText(lastDate.toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' }), W - padR - 10, H - 8);
  } else {
    ctx.fillText(firstDate.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric' }), padL + 10, H - 8);
    ctx.fillText(lastDate.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric' }), W - padR - 10, H - 8);
  }

  // 轴标题
  ctx.fillStyle = 'rgba(255,183,197,.4)';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('爱', padL - 14, padT + 8);
  ctx.fillText('能', padL - 14, padT + mapH - 2);
}

function handleTideClick(e) {
  const canvas = document.getElementById('tide-canvas');
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  let closest = null, minDist = 20;
  _tidePoints.forEach(p => {
    const dlp = Math.hypot(p.x - cx, p.lpY - cy);
    const den = Math.hypot(p.x - cx, p.enY - cy);
    const d = Math.min(dlp, den);
    if (d < minDist) { minDist = d; closest = p; }
  });
  const tooltip = document.getElementById('tide-tooltip');
  if (closest) {
    const emo = closest.emo;
    const ev = closest.ev;
    const time = new Date(ev.time).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const comp = emo.secondary && emo.secondary.length > 0
      ? emo.primary + ' ∩ ' + emo.secondary.join('∩') + ' = ' + (emo.label || '')
      : emo.primary;
    tooltip.innerHTML =
      '<div style="color:' + (EMOTION_COLORS[emo.primary] || '#fff') + ';font-weight:600;font-size:12px">' + (emo.label || emo.primary) + '</div>' +
      '<div style="color:#aaa;margin-top:2px">' + comp + '</div>' +
      '<div style="margin-top:3px"><span style="color:#FF8C42">爱 ' + emo.love_presence.toFixed(2) + '</span> · <span style="color:#4ECDC4">能 ' + emo.energy.toFixed(2) + '</span></div>' +
      '<div style="color:#666;margin-top:2px;font-size:10px">' + time + '</div>';
    tooltip.style.display = 'block';
    const tx = Math.min(cx + 10, rect.width - 200);
    const ty = Math.max(cy - 45, 5);
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
  } else {
    tooltip.style.display = 'none';
  }
}

// ============ 情绪花 ============
const EMOTION_ORDER = ['温暖', '喜悦', '信任', '惊喜', '期待', '悲伤', '失落', '愤怒'];
let _flowerPetals = [];

function drawEmotionFlower() {
  const canvas = document.getElementById('flower-canvas');
  if (!canvas) return;
  if (!canvas._bound) {
    canvas.addEventListener('click', handleFlowerClick);
    canvas._bound = true;
  }
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const cx = W / 2, cy = H / 2;
  const maxR = Math.min(W, H) / 2 - 30;

  ctx.clearRect(0, 0, W, H);

  // 装饰星点
  for (let i = 0; i < 25; i++) {
    const sx = Math.random() * W, sy = Math.random() * H;
    const sr = Math.random() * 1.2 + 0.3;
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.06 + 0.02) + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }

  // 统计每种情绪出现次数（primary权重1，secondary每个权重0.5）
  const counts = {};
  EMOTION_ORDER.forEach(e => counts[e] = 0);
  const allEvents = [...growthEvents];
  allEvents.forEach(ev => {
    const emo = inferEmotion(ev);
    counts[emo.primary] = (counts[emo.primary] || 0) + 1;
    if (emo.secondary) emo.secondary.forEach(s => { counts[s] = (counts[s] || 0) + 0.5; });
  });
  const maxCount = Math.max(...Object.values(counts), 1);

  const countEl = document.getElementById('flower-count');
  if (countEl) countEl.textContent = allEvents.length ? '(' + allEvents.length + '朵)' : '';

  if (allEvents.length === 0) {
    ctx.fillStyle = '#666';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('还没有情绪数据，花还没开', cx, cy);
    return;
  }

  // 同心圆网格
  ctx.strokeStyle = 'rgba(120,140,200,.07)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, maxR * i / 3, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 绘制花瓣
  _flowerPetals = [];
  const angleStep = (Math.PI * 2) / EMOTION_ORDER.length;

  EMOTION_ORDER.forEach((emo, i) => {
    const angle = i * angleStep - Math.PI / 2; // 从正上方开始
    const ratio = counts[emo] / maxCount;
    const r = Math.max(8, ratio * maxR);
    const color = EMOTION_COLORS[emo];

    // 花瓣形状（用贝塞尔曲线画椭圆花瓣）
    const tipX = cx + Math.cos(angle) * r;
    const tipY = cy + Math.sin(angle) * r;
    const perpAngle = angle + Math.PI / 2;
    const petalW = r * 0.35;

    // 花瓣填充
    const grad = ctx.createRadialGradient(cx, cy, 0, tipX, tipY, r);
    grad.addColorStop(0, color + '15');
    grad.addColorStop(0.5, color + '40');
    grad.addColorStop(1, color + '70');
    ctx.fillStyle = grad;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(
      cx + Math.cos(perpAngle) * petalW + Math.cos(angle) * r * 0.3,
      cy + Math.sin(perpAngle) * petalW + Math.sin(angle) * r * 0.3,
      tipX, tipY
    );
    ctx.quadraticCurveTo(
      cx - Math.cos(perpAngle) * petalW + Math.cos(angle) * r * 0.3,
      cy - Math.sin(perpAngle) * petalW + Math.sin(angle) * r * 0.3,
      cx, cy
    );
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 花瓣边缘
    ctx.strokeStyle = color + 'aa';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 花瓣尖端发光点
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(tipX, tipY, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(tipX, tipY, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // 情绪标签
    const labelR = r + 14;
    const lx = cx + Math.cos(angle) * labelR;
    const ly = cy + Math.sin(angle) * labelR;
    ctx.fillStyle = color;
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emo, lx, ly);

    // 次数标签
    if (counts[emo] > 0) {
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.font = '8px sans-serif';
      ctx.fillText(Math.round(counts[emo] * 10) / 10, lx, ly + 10);
    }

    _flowerPetals.push({
      cx, cy, angle, r, tipX, tipY, petalW, emo, count: counts[emo], color
    });
  });

  // 中心花蕊
  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 12);
  coreGrad.addColorStop(0, 'rgba(255,215,0,.8)');
  coreGrad.addColorStop(0.5, 'rgba(255,183,197,.4)');
  coreGrad.addColorStop(1, 'rgba(255,183,197,0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFD700';
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.beginPath();
  ctx.arc(cx - 1, cy - 1, 1.5, 0, Math.PI * 2);
  ctx.fill();
}

function handleFlowerClick(e) {
  const canvas = document.getElementById('flower-canvas');
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  let closest = null, minDist = 22;
  _flowerPetals.forEach(p => {
    // 检查点击是否在某花瓣区域内
    const dx = cx - p.cx, dy = cy - p.cy;
    const dist = Math.hypot(dx, dy);
    if (dist < p.r + 10) {
      const clickAngle = Math.atan2(dy, dx);
      let angleDiff = Math.abs(clickAngle - p.angle);
      if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;
      if (angleDiff < Math.PI / EMOTION_ORDER.length) {
        if (dist < minDist + p.r) { minDist = dist; closest = p; }
      }
    }
  });
  const tooltip = document.getElementById('flower-tooltip');
  if (closest) {
    tooltip.innerHTML =
      '<div style="color:' + closest.color + ';font-weight:600;font-size:13px">' + closest.emo + '</div>' +
      '<div style="color:#aaa;margin-top:3px">出现 ' + (Math.round(closest.count * 10) / 10) + ' 次</div>' +
      '<div style="color:#888;margin-top:2px;font-size:10px">花瓣长度 = 出现频率</div>';
    tooltip.style.display = 'block';
    const tx = Math.min(cx + 10, rect.width - 180);
    const ty = Math.max(cy - 35, 5);
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
  } else {
    tooltip.style.display = 'none';
  }
}

// ============ 设置 ============
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  const isOpen = sb.classList.toggle('open');
  ov.classList.toggle('show', isOpen);
  if (isOpen) {
    const uid = document.getElementById('sidebar-uid');
    const name = settings.nickname ? settings.nickname + ' · ' : '';
    uid.textContent = name + settings.instanceId;
  }
}

function toggleSettings() {
  document.getElementById('setting-apikey').value = settings.apiKey;
  document.getElementById('setting-model').value = settings.model;
  document.getElementById('setting-instance-id').value = settings.instanceId;
  document.getElementById('setting-nickname').value = settings.nickname || '';
  document.getElementById('settings-modal').classList.toggle('open');
}

function saveSettings() {
  settings.apiKey = document.getElementById('setting-apikey').value || DEFAULT_API_KEY;
  settings.model = document.getElementById('setting-model').value || DEFAULT_MODEL;
  settings.instanceId = document.getElementById('setting-instance-id').value || settings.instanceId;
  const newNickname = document.getElementById('setting-nickname').value.trim();
  const nicknameChanged = newNickname && newNickname !== settings.nickname;
  settings.nickname = newNickname;
  localStorage.setItem('zhile_settings', JSON.stringify(settings));
  document.getElementById('settings-modal').classList.remove('open');
  updateUserIdentity();
  
  // 设置昵称加好感
  if (nicknameChanged) {
    addAffection(5, '告诉知乐你的名字');
  }
  checkAchievements();
  
  const greet = settings.nickname ? '设置已保存。知乐会记住「' + settings.nickname + '」的～' : '设置已保存。';
  addSystemMsg(greet + ' 实例ID: ' + settings.instanceId);
}

function updateUserIdentity() {
  const el = document.getElementById('user-identity');
  if (el) {
    const name = settings.nickname ? settings.nickname + ' · ' : '';
    el.textContent = '(' + name + settings.instanceId + ')';
  }
}

function clearChat() {
  if (!confirm('确定清空所有对话记录吗？成长事件和好感度不会被清除。')) return;
  messages = [];
  _lastMsgTime = 0;
  localStorage.removeItem('zhile_messages');
  document.getElementById('messages').innerHTML = '';
  addSystemMsg('对话已清空。跟她重新打个招呼吧～');
  document.getElementById('settings-modal').classList.remove('open');
}

function exportData() {
  const ZHILE_KEYS = ['zhile_settings','zhile_messages','zhile_growth','zhile_chat_count','zhile_achievements','zhile_emoji_collection','zhile_sticker_collection','zhile_login_dates','zhile_secret_langs','zhile_affection','zhile_affection_log','zhile_daily_gain','zhile_last_login'];
  const data = { _app: 'zhile-web', _version: '0.16', _exported: new Date().toISOString() };
  ZHILE_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v !== null) data[k] = v; });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'zhile-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById('settings-modal').classList.remove('open');
  addSystemMsg('数据已导出！把文件传到新手机，在设置里点「导入数据」即可恢复～');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data._app !== 'zhile-web') { alert('这不是知乐的备份文件哦～'); return; }
      if (!confirm('导入会覆盖当前所有数据，确定吗？')) return;
      Object.keys(data).forEach(k => {
        if (k.startsWith('_')) return;
        localStorage.setItem(k, data[k]);
      });
      addSystemMsg('数据导入成功！正在刷新页面…');
      setTimeout(() => location.reload(), 800);
    } catch (err) {
      alert('文件解析失败：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============ 事件绑定 ============
document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.addEventListener('click', e => {
  if (e.target.classList.contains('settings-modal')) {
    e.target.classList.remove('open');
  }
});

// 启动
init();
