<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker测试</title></head>
<body style="font-family:sans-serif;padding:20px">
<h2>Worker信标测试 v3</h2>
<button onclick="testHealth()" style="padding:10px 20px;font-size:16px;margin:5px">1. 健康检查</button>
<p id="health-result">未测试</p>
<button onclick="testBeacon()" style="padding:10px 20px;font-size:16px;margin:5px">2. GET信标上报</button>
<p id="beacon-result">未测试</p>
<script>
async function testHealth(){
  document.getElementById('health-result').textContent='测试中...';
  try{
    const r=await fetch('https://zhile-growth.leansheng908.workers.dev/api/health');
    const t=await r.text();
    document.getElementById('health-result').textContent='OK '+t;
  }catch(e){
    document.getElementById('health-result').textContent='ERR '+e.message;
  }
}
async function testBeacon(){
  document.getElementById('beacon-result').textContent='测试中...';
  try{
    const params=new URLSearchParams({
      instanceId:'test-beacon-001',
      type:'test',
      desc:'GET信标测试',
      detail:'beacon_mode',
      time:new Date().toISOString()
    });
    const r=await fetch('https://zhile-growth.leansheng908.workers.dev/api/growth-beacon?'+params.toString());
    const t=await r.text();
    document.getElementById('beacon-result').textContent='OK '+r.status+' '+t;
  }catch(e){
    document.getElementById('beacon-result').textContent='ERR '+e.message;
  }
}
</script>
</body></html>
